services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kh-api

    command: ["node", "dist/src/main.js"]
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - .env
 
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=10"
    networks:
      - kh-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3


  db:
    image: postgres:16-alpine
    container_name: kh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kh-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  adminer:
    image: adminer
    profiles:
      - debug
    ports:
      - "8080:8080"
    networks:
      - kh-network

networks:
  kh-network:
    driver: bridge

volumes:
  postgres_data:
  





